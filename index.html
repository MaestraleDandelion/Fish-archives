<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>鱼鱼档案库</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="assets/vue.css">
  <style>
    :root { --theme-color: #8aa4b8; }

    html, body {
      overflow-x: hidden;
      max-width: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                   "Microsoft YaHei", "Noto Sans SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .markdown-section {
      max-width: 780px;
      width: 100%;
      box-sizing: border-box;
      line-height: 1.9;
      font-size: 16px;
      padding-top: 24px;
    }
    .markdown-section h1 { font-size: 1.65em; margin-top: 0; }
    .markdown-section h2 { font-size: 1.25em; margin-top: 2em; }
    .markdown-section p,
    .markdown-section li { letter-spacing: 0.01em; }
    .markdown-section blockquote {
      color: #5b6b78;
      border-left: 2px solid #dfe5ea;
      background: none;
      padding: 0 0 0 14px;
      margin: 1em 0;
      border-radius: 0;
      box-sizing: border-box;
    }
    .markdown-section blockquote p { font-weight: inherit; }
    .markdown-section pre {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .markdown-section pre > code {
      white-space: pre;
    }
    .markdown-section code {
      background: #f2f4f6;
      padding: 2px 5px;
      border-radius: 3px;
      font-size: 0.9em;
    }

    .sidebar { width: 250px; }
    .sidebar ul li a { font-size: 15px; }
    .search input { font-size: 15px; }

    @media (max-width: 768px) {
      .markdown-section {
        font-size: 15.5px;
        line-height: 1.85;
        padding: 16px 16px 120px;
      }
      .markdown-section h1 { font-size: 1.45em; }
      .sidebar-toggle {
        background: rgba(255, 255, 255, 0.94);
        border-radius: 50%;
        box-shadow: 0 1px 8px rgba(0, 0, 0, 0.14);
      }
    }
  </style>
</head>
<body>
  <div id="app">载入中…</div>

  <script>
    window.$docsify = {
      name: '鱼鱼档案库',
      loadSidebar: true,
      auto2top: true,
      search: {
        placeholder: '搜角色、台词、标签…',
        noData: '没找到，换个词试试。',
        depth: 3,
        maxAge: 0
      }
    }
  </script>

  <script src="assets/docsify.min.js"></script>
  <script src="assets/search.min.js"></script>
</body>
</html>
