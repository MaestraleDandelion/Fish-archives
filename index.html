<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>鱼鱼档案库</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <link rel="stylesheet" href="assets/vue.css">
  <style>
    :root { --theme-color: #8aa4b8; }

    html, body {
      overflow-x: hidden;
      max-width: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                   "Microsoft YaHei", "Noto Sans SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .markdown-section {
      max-width: 780px;
      width: 100%;
      box-sizing: border-box;
      line-height: 1.9;
      font-size: 16px;
      padding-top: 24px;
    }
    .markdown-section h1 { font-size: 1.65em; margin-top: 0; }
    .markdown-section h2 { font-size: 1.25em; margin-top: 2em; }
    .markdown-section p,
    .markdown-section li { letter-spacing: 0.01em; }
    .markdown-section blockquote {
      color: #5b6b78;
      border-left: 2px solid #dfe5ea;
      background: none;
      padding: 0 0 0 14px;
      margin: 1em 0;
      border-radius: 0;
      box-sizing: border-box;
    }
    .markdown-section blockquote p { font-weight: inherit; }
    .markdown-section pre {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .markdown-section pre > code {
      white-space: pre;
    }
    .markdown-section img {
      max-width: 100%;
      height: auto;
    }
    /* 视频封面：点击跳原站，所以做得像张卡片 */
    .markdown-section p > a > img {
      max-width: min(440px, 100%);
      border-radius: 6px;
      box-shadow: 0 1px 8px rgba(0, 0, 0, 0.10);
      margin: 2px 0;
    }
    .markdown-section code {
      background: #f2f4f6;
      padding: 2px 5px;
      border-radius: 3px;
      font-size: 0.9em;
    }

    .sidebar { width: 250px; }
    .sidebar ul li a { font-size: 15px; }
    .search input { font-size: 15px; }

    /* 作品下面的条目默认收起，点到这部作品（或它的条目）时才展开。
       链接还留在页面里，展开时才有东西可点。 */
    .sidebar-nav li > ul { display: none; }
    .sidebar-nav li:has(> p.active) > ul,
    .sidebar-nav li:has(li.active) > ul { display: block; }

    .sidebar-nav li:has(> ul) > p > a::after {
      content: '';
      display: inline-block;
      width: 0;
      height: 0;
      margin-left: 6px;
      border: 4px solid transparent;
      border-left-color: #b4c1cc;
      vertical-align: middle;
      transition: transform 0.15s ease;
    }
    .sidebar-nav li:has(> p.active) > p > a::after,
    .sidebar-nav li:has(li.active) > p > a::after {
      transform: rotate(90deg);
    }

    @supports not selector(:has(*)) {
      .sidebar-nav li > ul { display: block; }
    }

  </style>
  <link rel="stylesheet" href="assets/home.css">
  <link rel="stylesheet" href="assets/mobile.css">
</head>
<body>
  <div id="app">载入中…</div>

  <script>
    window.$docsify = {
      name: '鱼鱼档案库',
      loadSidebar: true,
      auto2top: true,
      search: {
        placeholder: '搜角色、台词、标签…',
        noData: '没找到，换个词试试。',
        depth: 3,
        maxAge: 0
      }
    }
  </script>

  <!-- 本地预览和发布时由 更新搜索索引.ps1 生成。 -->
  <script src="assets/search-pages.js"></script>

  <script>
    // GitHub Pages 给每个文件都设了 10 分钟缓存，改完内容刷新会看到旧版。
    // 这里给每次请求的 .md 加一个时间戳，强制取最新的。
    (function () {
      var open = XMLHttpRequest.prototype.open;
      var stamp = Date.now();
      XMLHttpRequest.prototype.open = function (method, url) {
        var args = Array.prototype.slice.call(arguments);
        if (String(method).toUpperCase() === 'GET' && /\.md(\?|$)/.test(String(url))) {
          args[1] = url + (String(url).indexOf('?') > -1 ? '&' : '?') + '_=' + stamp;
        }
        return open.apply(this, args);
      };
    })();
  </script>

<template id="archive-home">
  <div id="whale-archive">
    <h1>鱼鱼档案库</h1>
    <div class="columns">
      <section><h2>最近更新</h2><div class="rows" id="archive-rows"></div></section>
      <section><h2>随机翻一条</h2>
        <div class="sea">
          <div class="pick" aria-live="polite"><p class="category"></p><p><strong></strong></p><blockquote><p></p></blockquote></div>
          <div class="water" aria-hidden="true">
          <svg viewBox="0 0 400 155" class="whale" xmlns="http://www.w3.org/2000/svg">
            <defs><linearGradient id="archive-hide" x1="0%" y1="0%" x2="30%" y2="100%"><stop stop-color="#92c9e7"/><stop offset=".57" stop-color="#609bc8"/><stop offset="1" stop-color="#36759e"/></linearGradient></defs>
            <g stroke="#447fa5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path fill="url(#archive-hide)" d="M80 76 C62 70 53 61 43 47 C36 35 26 30 12 29 C14 49 25 67 47 74 C33 77 21 87 13 101 C34 101 51 92 64 83 C72 81 80 83 92 88 C126 103 170 113 222 113 C276 115 322 101 350 86 C367 77 380 66 379 59 C378 54 362 52 339 49 C301 42 263 39 227 43 C200 46 180 52 161 54 C151 53 145 48 139 44 C138 51 141 56 145 59 C118 68 98 77 80 76 Z"/>
              <path d="M127 93 C173 106 205 104 247 97 C299 88 344 76 378 59 C369 76 339 96 296 105 C231 121 169 112 127 93Z" fill="#aed6e5" stroke="none"/>
              <path d="M378 60 C363 67 349 70 334 73" fill="none"/>
              <path d="M345 79 Q319 94 284 100 M351 79 Q326 94 301 99" fill="none" opacity=".48" stroke-width="1"/>
              <path class="flipper" d="M263 89 C249 102 235 122 202 131 C212 115 222 100 233 93" fill="#5e98bc"/>
              <circle cx="329" cy="67" r="2.4" fill="#244d6b" stroke="none"/>
              <path d="M181 60 Q209 50 235 50" fill="none" stroke="#d2e8ef" opacity=".68"/>
            </g>
          </svg>
        </div>
          <div class="card-actions"><a class="readpick">读这一条 ↗</a><button type="button" class="another">换一条 ↻</button></div>
        </div>
      </section>
    </div>
  </div>
</template>
  <script src="assets/home-entries.js"></script>
  <script src="assets/home.js?v=0.8"></script>
  <template id="mobile-controls">
    <nav class="reader-bar" aria-label="手机阅读工具">
      <button type="button" data-panel="catalog" aria-controls="reader-dialog" aria-haspopup="dialog">目录</button>
      <button type="button" data-panel="search" aria-controls="reader-dialog" aria-haspopup="dialog">搜索档案</button>
    </nav>
    <dialog id="reader-dialog" aria-labelledby="reader-heading">
      <header><strong id="reader-heading">目录</strong><button type="button" class="reader-close">关闭</button></header>
    </dialog>
  </template>
  <script src="assets/mobile.js"></script>
  <script src="assets/docsify.min.js"></script>
  <script src="assets/search.min.js"></script>
</body>
</html>
