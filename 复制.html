<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>复制规范 · 鱼鱼档案库</title>
  <meta name="robots" content="noindex">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 20px 80px;
      line-height: 1.85;
      color: #2c3e50;
      -webkit-font-smoothing: antialiased;
    }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    p { color: #5b6b78; }
    button {
      font: inherit;
      font-size: 17px;
      padding: 14px 22px;
      border: none;
      border-radius: 10px;
      background: #8aa4b8;
      color: #fff;
      cursor: pointer;
      width: 100%;
      margin: 8px 0;
    }
    button:active { background: #7691a6; }
    #msg { min-height: 1.6em; color: #4a8f6a; font-size: 15px; }
    details { margin-top: 28px; border-top: 1px solid #e6eaee; padding-top: 16px; }
    summary { cursor: pointer; color: #5b6b78; font-size: 15px; }
    textarea {
      width: 100%;
      box-sizing: border-box;
      height: 320px;
      margin-top: 12px;
      padding: 12px;
      font: 12px/1.6 ui-monospace, Consolas, "Courier New", monospace;
      border: 1px solid #dfe4e8;
      border-radius: 8px;
      background: #fafbfc;
      color: #3c4a56;
    }
    .back { display: inline-block; margin-top: 32px; color: #8aa4b8; text-decoration: none; font-size: 15px; }
  </style>
</head>
<body>
  <h1>复制规范</h1>
  <p>点下面的按钮，把完整的《精简版说明书》复制到剪贴板，然后去别的对话里粘贴。</p>

  <button id="btn">复制《说明书-精简版》</button>
  <p id="msg"></p>

  <details id="fallback">
    <summary>复制不了？点开这里手动全选</summary>
    <textarea id="raw" readonly placeholder="载入中…"></textarea>
  </details>

  <a class="back" href="index.html">← 回档案库</a>

  <script>
    var btn = document.getElementById('btn');
    var msg = document.getElementById('msg');
    var raw = document.getElementById('raw');
    var box = document.getElementById('fallback');

    fetch('说明书-精简版.md', { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (t) { raw.value = t; })
      .catch(function () { msg.textContent = '规范文件没载入，检查一下网络。'; });

    btn.addEventListener('click', function () {
      if (!raw.value) { msg.textContent = '还没载入完，再点一次。'; return; }

      function fallback() {
        box.open = true;
        raw.focus();
        raw.select();
        msg.textContent = '浏览器不让自动复制，已经替你选中了，按 Ctrl+C（手机上长按复制）。';
      }

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(raw.value).then(function () {
          msg.textContent = '已复制。去别的对话里粘贴吧。';
        }).catch(fallback);
      } else {
        fallback();
      }
    });
  </script>
</body>
</html>
